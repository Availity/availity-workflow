version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gh-actions:
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: npm
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
      time: "10:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
    groups:
      nx:
        patterns:
          - "nx"
          - "@nx/*"
        update-types:
          - "major"
      commitlint:
        patterns:
          - "@commitlint/*"
        update-types:
          - "major"
      conventional-changelog:
        patterns:
          - "conventional-changelog-*"
        update-types:
          - "major"
      jest:
        patterns:
          - "jest"
          - "*jest*"
        update-types:
          - "major"
      dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
