name: Lint Commit Messages
on: [pull_request]

jobs:
  commitlint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      # Full install is required because commitlint.config.js extends
      # @commitlint/config-nx-scopes, which reads the NX workspace at
      # runtime to enumerate valid scope names. The yarn cache above
      # (keyed on yarn.lock) means this is a cache-restore on most runs.
      # wagoid/commitlint-github-action cannot be used here — it runs in
      # an isolated Docker container that cannot resolve the Nx workspace,
      # causing it to hang indefinitely.
      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint Commit Messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
