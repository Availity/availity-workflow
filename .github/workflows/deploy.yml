# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Publish Release

on:
  push:
    branches: [ master ]

jobs:
  setup:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') &&
      !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: "master"

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: "master"

      - name: Set Node Version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: |
          echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Restore yarn cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-24-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-24-yarn-

      - name: Restore Nx cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/yarn.lock') }}-
            ${{ runner.os }}-nx-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Check Constraints
        run: yarn constraints

      - name: Lint Affected Code
        run: yarn nx affected --target=lint

      - name: Unit Test Affected Code
        run: yarn nx affected --target=test

      - name: Integration Test Affected Code
        run: yarn nx affected --target=integration

      - name: Build App
        run: yarn build:app

  publish:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') &&
      !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    needs: [ setup ]
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      contents: write # Required for git push and creating tags
      pull-requests: write # Required for creating pull requests
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: "master"

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: "master"

      - name: Set Node Version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: |
          echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Restore yarn cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-24-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-24-yarn-

      - name: Restore Nx cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/yarn.lock') }}-
            ${{ runner.os }}-nx-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Setup Publish Config
        run: |
          git config user.email ${{ secrets.GH_EMAIL }}
          git config user.name ${{ secrets.GH_USER }}

      - name: Store initial commit SHA
        id: initial-sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Version Packages
        run: |
          yarn nx affected --target version --parallel=1

      - name: Check for Version Changes
        id: changes
        run: |
          INITIAL_SHA="${{ steps.initial-sha.outputs.sha }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$INITIAL_SHA" = "$CURRENT_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new commits created by version step"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New commits created by version step"
          fi

      - name: Publish
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          yarn nx affected --target publish --parallel=1

      - name: Create Release PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating PR because changes detected: ${{ steps.changes.outputs.has_changes }}"
          git push origin --delete release/version-updates || true
          git checkout -b release/version-updates
          git push origin release/version-updates
          git push origin --tags
          gh pr create --title "Release: Version Updates" --body "Automated release PR with version updates and package publications." --base master --head release/version-updates

  deploy-docs:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') &&
      !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    needs: [ setup ]
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: "master"

      - name: Set Node Version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Docs
        run: yarn nx build docusaurus

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docusaurus/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
